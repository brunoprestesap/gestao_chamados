# ============================================================
# Configuração nginx com TLS — proposta da auditoria 2026-05-25 (C2)
# Como ativar:
#   1. Obter certificado para sigma.ap.trf1.gov.br (CA interna do TRF1 ou
#      autoassinado) e colocar em ./nginx/certs/ :
#        - fullchain.pem  (cert + cadeia)
#        - privkey.pem    (chave privada, chmod 600)
#   2. No docker-compose.yml, no serviço nginx, adicionar:
#        ports:
#          - '${APP_PORT:-80}:80'
#          - '443:443'
#        volumes:
#          - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
#          - ./nginx/certs:/etc/nginx/certs:ro
#      e liberar a 443 no UFW: sudo ufw allow 443/tcp
#   3. Substituir default.conf por este arquivo (ou copiar o conteúdo).
#   4. Setar AUTH_COOKIE_SECURE=true no .env e: docker compose up -d
# ============================================================

upstream nextjs {
    server next-app:3000;
}

upstream socketio {
    server socket-server:3001;
}

# HTTP → redireciona tudo para HTTPS
server {
    listen 80;
    server_name sigma.ap.trf1.gov.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sigma.ap.trf1.gov.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # Headers de segurança (auditoria B1)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;            # não expor versão do nginx (B1)

    # Next.js app
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
