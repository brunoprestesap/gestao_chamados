upstream nextjs {
    server next-app:3000;
}

upstream socketio {
    server socket-server:3001;
}

server {
    listen 80;
    server_name sigma.ap.trf1.gov.br;

    client_max_body_size 10M;

    # Health check — usado pelo HEALTHCHECK do container nginx e pelo Zabbix.
    # Responde localmente, sem depender do backend (isola a saúde do nginx).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Documentos do ativo (spec 0013, AC-15): laudo até 20 MB. Só este caminho
    # passa de 10M; a tela e a rota recusam acima de 20 MB com mensagem própria.
    location /api/ativos/documentos {
        client_max_body_size 21M;
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js app
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — WebSocket upgrade
    location /socket.io/ {
        proxy_pass http://socketio;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
