name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Pull and rebuild
        run: |
          cd /opt/severino
          git pull origin main
          docker compose up -d --build
          docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H "Host: sigma.ap.trf1.gov.br" http://127.0.0.1/ >/dev/null 2>&1; then
              echo "App responding"
              exit 0
            fi
            sleep 2
          done
          echo "App did not respond after rebuild"
          docker compose -f /opt/severino/docker-compose.yml ps
          exit 1
