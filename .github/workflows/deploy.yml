name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: self-hosted
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Pull and rebuild
        run: |
          cd /opt/severino
          git pull origin main
          docker compose up -d --build
          docker image prune -f
