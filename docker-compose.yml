services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://sigma.ap.trf1.gov.br}
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/manutencao
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET}
      SOCKET_EMIT_URL: http://socket-server:3001/emit
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      AUTH_URL: ${AUTH_URL:-http://sigma.ap.trf1.gov.br}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_DEBUG: ${LDAP_DEBUG:-false}
      CRON_SECRET: ${CRON_SECRET}
    volumes:
      - ./uploads:/app/data/uploads
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - sigma
    restart: unless-stopped

  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      SOCKET_PORT: 3001
      SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN}
      SOCKET_TRUSTED_PROXIES: next-app
      APP_URL: http://next-app:3000
    depends_on:
      next-app:
        condition: service_started
    networks:
      - sigma
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: manutencao
    networks:
      - sigma
    restart: unless-stopped
    ports:
      - '27017:27017'

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - next-app
      - socket-server
    networks:
      - sigma
    restart: unless-stopped

  # Cron job — chamados recorrentes (a cada 30 min)
  cron:
    image: alpine:3.20
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "*/30 * * * * curl -sf -X POST -H 'x-cron-secret: $$CRON_SECRET' http://next-app:3000/api/cron/recurring-tickets >> /proc/1/fd/1 2>&1" | crontab -
        apk add --no-cache curl > /dev/null 2>&1
        crond -f -l 6
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      next-app:
        condition: service_started
    networks:
      - sigma
    restart: unless-stopped

networks:
  sigma:
    driver: bridge

volumes:
  mongodb_data:
