services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/manutencao
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET}
      SOCKET_EMIT_URL: http://socket-server:3001/emit
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      AUTH_URL: ${AUTH_URL:-http://localhost}
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - severino
    restart: unless-stopped

  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      SOCKET_PORT: 3001
      SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN}
      SOCKET_TRUSTED_PROXIES: next-app
      APP_URL: http://next-app:3000
    depends_on:
      next-app:
        condition: service_started
    networks:
      - severino
    restart: unless-stopped

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: manutencao
    networks:
      - severino
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - next-app
      - socket-server
    networks:
      - severino
    restart: unless-stopped

networks:
  severino:
    driver: bridge

volumes:
  mongodb_data:
