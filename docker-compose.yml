services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://sigma.ap.trf1.gov.br}
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/manutencao
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-session}
      # Definir AUTH_COOKIE_SECURE=true APÓS habilitar TLS (ver nginx/default.tls.conf).
      # Com TLS ativo, o cookie de sessão passa a exigir HTTPS. [auditoria 2026-05-25]
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET}
      SOCKET_EMIT_URL: http://socket-server:3001/emit
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      AUTH_URL: ${AUTH_URL:-http://sigma.ap.trf1.gov.br}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_SEARCH_FILTER: ${LDAP_USER_SEARCH_FILTER:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_DEBUG: ${LDAP_DEBUG:-false}
      # IA local (spec 0001). Sem as três primeiras, a IA fica desligada.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
      LLM_DEBUG: ${LLM_DEBUG:-false}
      CRON_SECRET: ${CRON_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-sigma@ap.trf1.gov.br}
    volumes:
      # Bind mount: o diretório no host DEVE pertencer a 1001:1001 (uid do
      # usuário nextjs no container), senão /api/upload falha com EACCES.
      # Garantido pelo deploy.sh. [auditoria 2026-05-25, M3]
      - ./uploads:/app/data/uploads
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - sigma
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '5', '-O', '/dev/null', 'http://localhost:3000/login']
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s

  socket-server:
    build:
      context: ./socket-server
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      SOCKET_PORT: 3001
      SOCKET_INTERNAL_SECRET: ${SOCKET_INTERNAL_SECRET}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN}
      SOCKET_TRUSTED_PROXIES: next-app
      APP_URL: http://next-app:3000
    depends_on:
      next-app:
        condition: service_started
    networks:
      - sigma
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: manutencao
      # Defesa em profundidade (opcional) — habilitar autenticação.
      # ATENÇÃO: estas variáveis só criam o usuário em volume VAZIO.
      # Em produção (volume já populado) siga o procedimento em
      # scripts/mongo-enable-auth.md antes de descomentar abaixo.
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    # command: ['--auth']   # ver scripts/mongo-enable-auth.md
    networks:
      - sigma
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ping:1})']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # SEGURANÇA: porta 27017 NÃO é publicada no host. O next-app acessa o
    # MongoDB pela rede interna do Docker (mongodb:27017). Publicar a porta
    # expunha o banco a toda a rede interna (Docker ignora o UFW). [auditoria 2026-05-25]

  nginx:
    image: nginx:alpine
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - next-app
      - socket-server
    networks:
      - sigma
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-T', '5', '-O', '/dev/null', 'http://localhost/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Cron job — chamados recorrentes (a cada 30 min)
  cron:
    image: alpine:3.20
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache curl > /dev/null 2>&1
        # O segredo fica num arquivo só do root, fora do `crontab -l`.
        printf '%s' "$$CRON_SECRET" > /etc/cron-secret
        chmod 600 /etc/cron-secret
        # Cada job chama uma rota e grava uma linha no log do container: hora,
        # rota, resposta e código HTTP (inclusive 401 e falha de conexão).
        cat > /usr/local/bin/chamar-cron <<'SCRIPT'
        #!/bin/sh
        rota="$$1"
        inicio=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
        saida=$$(curl -sS --max-time 60 -w ' http=%{http_code}' -X POST -H "x-cron-secret: $$(cat /etc/cron-secret)" "http://next-app:3000/api/cron/$$rota" 2>&1 | tr '\n' ' ')
        echo "$$inicio $$rota $$saida" >> /proc/1/fd/1
        SCRIPT
        chmod 700 /usr/local/bin/chamar-cron
        # Todos os jobs num bloco só: um segundo `| crontab -` apagaria os anteriores.
        printf '%s\n' \
          '*/30 * * * * /usr/local/bin/chamar-cron recurring-tickets' \
          '*/15 * * * * /usr/local/bin/chamar-cron encerramento-automatico' \
          '*/15 * * * * /usr/local/bin/chamar-cron sla-monitor' \
          '# 11:00 UTC = 08:00 em Belém (spec 0013)' \
          '0 11 * * * /usr/local/bin/chamar-cron documentos-vencimento' \
          | crontab -
        # `exec`: o crond vira o PID 1, e `/proc/1/fd/1` passa a ser a saída que o
        # Docker registra (com o `sh` como PID 1 a linha do job se perdia).
        exec crond -f -l 6
    environment:
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      next-app:
        condition: service_started
    networks:
      - sigma
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pgrep crond >/dev/null 2>&1 || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  sigma:
    driver: bridge

volumes:
  mongodb_data:
